services:
  airflow:
    image: ${AIRFLOW_IMAGE}
    container_name: airflow
    restart: unless-stopped
    command: standalone
    env_file:
      - /opt/airflow/.env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
    ports:
      - "8080:8080"
    volumes:
      - /opt/airflow/data:/opt/airflow/data
      - /opt/airflow/logs:/opt/airflow/logs
